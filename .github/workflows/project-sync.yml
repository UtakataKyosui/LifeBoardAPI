name: Project sync

on:
  issues:
    types: [opened, reopened]
  pull_request_target:
    types: [opened, reopened, ready_for_review]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: project-sync-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  add:
    name: Add items to project
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # デフォルトブランチの設定ファイルだけを取得する。
      # pull_request_target ではPRのコードをcheckout・実行しない。
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/pj-synker.yml
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Install gh-pj-synker
        run: gh extension install UtakataKyosui/gh-pj-synker --pin v0.1.0
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Check the config file
        run: gh pj-synker config check

      - name: Add the event's item
        if: github.event_name == 'issues' || github.event_name == 'pull_request_target'
        env:
          GH_TOKEN: ${{ secrets.PROJECT_SYNC_TOKEN }}
          NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
        run: gh pj-synker add "$NUMBER"

      - name: Catch up on every eligible item
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.PROJECT_SYNC_TOKEN }}
        run: gh pj-synker add --all --yes --json
