name: Setup
description: pnpm と Node.js を用意し、pnpm store のキャッシュを使って依存関係をインストールする

runs:
  using: composite
  steps:
    # バージョンはルートの package.json の packageManager から読む
    - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

    # pnpm store を pnpm-lock.yaml のハッシュをキーにキャッシュする
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 22
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile --prefer-offline
